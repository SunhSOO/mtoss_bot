[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtoss-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16",
  "asyncpg>=0.30",
  "fastapi>=0.116",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "redis>=6.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "structlog>=25.0",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mtoss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mtoss"]
