[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtoss-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16",
  "asyncpg>=0.30",
  "fastapi>=0.116",
  "httpx2>=2.10",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "redis>=6.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "structlog>=25.0",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
# MetaTrader5 휠은 win_amd64 전용이다. 기본 의존성에 넣으면 ubuntu CI의 uv sync가 깨진다.
# 어댑터 단위 테스트는 sys.modules에 가짜 모듈을 주입해 리눅스에서도 돈다.
mt5 = ["MetaTrader5>=5.0.45; sys_platform=='win32'"]

[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mtoss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mtoss"]
